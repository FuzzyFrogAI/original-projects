<?xml version="1.0" encoding="UTF-8"?>
<!--
    diagrama-solucion.svg — Fuente editable del diagrama de la solución.

    Es el mismo diagrama que se embebe en el artículo (Figura 2 de
    markowitz-diagrama-solucion.html), agrupado por las dos preguntas que
    responde el pipeline. Reemplaza a un archivo .drawio: es un SVG
    autocontenido (colores y estilos inline, sin depender de
    fuzzyfrog-proyectos.css) para que GitHub lo muestre como imagen al
    entrar al repo, en vez de mostrar el código fuente.

    Si el diagrama del artículo cambia, este archivo se actualiza junto
    con él — es la misma fuente única que markowitz-diagrama-solucion.html
    y el Explorador de decisiones.

    Paleta FuzzyFrog.AI (igual a la del notebook):
      ocean #006a87  ·  night #001f3d  ·  accent #32ecfd  ·  right #00b76c
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 28 680 866" role="img"
     aria-labelledby="diag-sol-titulo diag-sol-desc" font-family="'DM Sans', 'Segoe UI', system-ui, sans-serif">
    <title id="diag-sol-titulo">Diagrama de componentes agrupado por las dos preguntas que responde el pipeline</title>
    <desc id="diag-sol-desc">Grupo 1 (rendimiento esperado): datos abiertos de yFinance, features estacionarias y pronóstico a 21 días con seis modelos contra dos referencias. Grupo 2 (pesos óptimos): filtro CAPM por alfa, optimización de Markowitz y portafolio del mes siguiente medido con costos.</desc>

    <defs>
        <marker id="arrow-sol" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M2 1L8 5L2 9" fill="none" stroke="#001f3d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
    </defs>

    <rect width="680" height="894" y="28" fill="#f4fffe"/>

    <!-- Grupo 1 -->
    <rect x="60" y="40" width="560" height="416" rx="16" fill="none" stroke="#006a87" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="84" y="72" fill="#001f3d" font-size="15">Pregunta 1 ➲ ¿cuál es el rendimiento esperado de cada activo?</text>

    <rect x="110" y="96" width="460" height="92" rx="8" fill="#ffffff" stroke="#006a87" stroke-width="1.5"/>
    <text x="340" y="126" text-anchor="middle" fill="#001f3d" font-size="18" font-weight="700">Datos abiertos</text>
    <text x="340" y="152" text-anchor="middle" fill="#001f3d" font-size="15">yFinance ➲ 10 acciones + S&amp;P 500 + T-bill</text>
    <text x="340" y="174" text-anchor="middle" fill="#006a87" font-size="13" font-style="italic">AMZN · META · AAPL</text>
    <line x1="340" y1="188" x2="340" y2="220" stroke="#001f3d" stroke-width="1.5" marker-end="url(#arrow-sol)"/>

    <rect x="110" y="224" width="460" height="92" rx="8" fill="#ffffff" stroke="#006a87" stroke-width="1.5"/>
    <text x="340" y="254" text-anchor="middle" fill="#001f3d" font-size="18" font-weight="700">Features estacionarias</text>
    <text x="340" y="280" text-anchor="middle" fill="#001f3d" font-size="15">Todas relativas al precio ➲ ninguna crece sin límite</text>
    <text x="340" y="302" text-anchor="middle" fill="#006a87" font-size="13" font-style="italic">Rendimiento · SMA · Bollinger · RSI · Autocorr.</text>
    <line x1="340" y1="316" x2="340" y2="348" stroke="#001f3d" stroke-width="1.5" marker-end="url(#arrow-sol)"/>

    <rect x="110" y="352" width="460" height="92" rx="8" fill="#ffffff" stroke="#006a87" stroke-width="1.5"/>
    <text x="340" y="382" text-anchor="middle" fill="#001f3d" font-size="18" font-weight="700">Pronóstico a 21 días</text>
    <text x="340" y="408" text-anchor="middle" fill="#001f3d" font-size="15">6 modelos contra 2 referencias que no aprenden</text>
    <text x="340" y="430" text-anchor="middle" fill="#006a87" font-size="13" font-style="italic">LSTM · GRU · Ridge · Gradient Boosting</text>

    <!-- Conexión entre grupos -->
    <line x1="340" y1="444" x2="340" y2="492" stroke="#001f3d" stroke-width="1.5" marker-end="url(#arrow-sol)"/>
    <text x="356" y="478" fill="#001f3d" font-size="15">rendimientos esperados</text>

    <!-- Grupo 2 -->
    <rect x="60" y="496" width="560" height="384" rx="16" fill="none" stroke="#006a87" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="84" y="528" fill="#001f3d" font-size="15">Pregunta 2 ➲ ¿qué pesos minimizan el riesgo del portafolio?</text>

    <rect x="110" y="548" width="460" height="72" rx="8" fill="#ffffff" stroke="#006a87" stroke-width="1.5"/>
    <text x="340" y="578" text-anchor="middle" fill="#001f3d" font-size="18" font-weight="700">Filtro CAPM</text>
    <text x="340" y="604" text-anchor="middle" fill="#001f3d" font-size="15">Entra si el pronóstico supera lo exigido ➲ alfa &gt; 0</text>
    <line x1="340" y1="620" x2="340" y2="652" stroke="#001f3d" stroke-width="1.5" marker-end="url(#arrow-sol)"/>

    <rect x="110" y="656" width="460" height="72" rx="8" fill="#ffffff" stroke="#006a87" stroke-width="1.5"/>
    <text x="340" y="686" text-anchor="middle" fill="#001f3d" font-size="18" font-weight="700">Optimización de Markowitz</text>
    <text x="340" y="712" text-anchor="middle" fill="#001f3d" font-size="15">Covarianza Ledoit-Wolf + SLSQP</text>
    <line x1="340" y1="728" x2="340" y2="760" stroke="#001f3d" stroke-width="1.5" marker-end="url(#arrow-sol)"/>

    <rect x="110" y="764" width="460" height="72" rx="8" fill="#001f3d" stroke="#001f3d" stroke-width="1.5"/>
    <text x="340" y="794" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">Portafolio del mes siguiente</text>
    <text x="340" y="820" text-anchor="middle" fill="#e8fbf7" font-size="15">Se mide con rendimientos reales y costos</text>
</svg>
