<?xml version="1.0" encoding="UTF-8"?>
<!--
    diagrama-solucion.svg — Fuente editable del diagrama de la solución.

    Es el mismo diagrama que se embebe en el artículo (Figura 1 de
    prediccion-ventas-diagrama-solucion.html): un historial de
    transacciones, limpio una sola vez, que alimenta tres análisis
    independientes (pronóstico, anomalías, segmentación), cada uno con su
    propia forma de evaluarse. SVG autocontenido (colores y estilos
    inline, sin depender de fuzzyfrog-proyectos.css) para que GitHub lo
    muestre como imagen al entrar al repo.

    Si el diagrama del artículo cambia, este archivo se actualiza junto
    con él — es la misma fuente única que markowitz usa para su propio
    diagrama editable.

    Paleta FuzzyFrog.AI: ocean #006a87  ·  night #001f3d
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 600" role="img"
     aria-labelledby="diag-sol-titulo diag-sol-desc" font-family="'DM Sans', 'Segoe UI', system-ui, sans-serif">
    <title id="diag-sol-titulo">Diagrama del pipeline: un historial de ventas, tres preguntas, tres formas de evaluar</title>
    <desc id="diag-sol-desc">Transacciones sintéticas y limpieza alimentan tres análisis independientes: pronóstico mensual evaluado con backtest walk-forward, detección diaria de anomalías evaluada contra anomalías conocidas, y segmentación de clientes evaluada contra la recompra real de 2024. Los tres resultados alimentan el Explorador de decisiones del artículo.</desc>

    <defs>
        <marker id="arrow-vsol" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M2 1L8 5L2 9" fill="none" stroke="#001f3d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
    </defs>

    <rect width="1220" height="600" fill="#f4fffe"/>

    <rect x="30" y="60" width="200" height="90" rx="8" fill="#ffffff" stroke="#006a87" stroke-width="1.5"/>
    <text x="130" y="96" text-anchor="middle" fill="#001f3d" font-size="15.5" font-weight="700">Transacciones</text>
    <text x="130" y="116" text-anchor="middle" fill="#006a87" font-size="11.5" font-style="italic">sintéticas · 5 años</text>
    <text x="130" y="132" text-anchor="middle" fill="#006a87" font-size="11.5" font-style="italic">4 sucursales</text>

    <line x1="230" y1="105" x2="268" y2="105" stroke="#001f3d" stroke-width="1.5" marker-end="url(#arrow-vsol)"/>

    <rect x="270" y="60" width="200" height="90" rx="8" fill="#ffffff" stroke="#006a87" stroke-width="1.5"/>
    <text x="370" y="96" text-anchor="middle" fill="#001f3d" font-size="15.5" font-weight="700">Limpieza</text>
    <text x="370" y="116" text-anchor="middle" fill="#006a87" font-size="11.5" font-style="italic">anuladas · duplicados</text>
    <text x="370" y="132" text-anchor="middle" fill="#006a87" font-size="11.5" font-style="italic">descuentos · devoluciones</text>

    <line x1="470" y1="105" x2="507" y2="105" stroke="#001f3d" stroke-width="1.5" marker-end="url(#arrow-vsol)"/>
    <line x1="470" y1="105" x2="507" y2="295" stroke="#001f3d" stroke-width="1.5" marker-end="url(#arrow-vsol)"/>
    <line x1="470" y1="105" x2="507" y2="485" stroke="#001f3d" stroke-width="1.5" marker-end="url(#arrow-vsol)"/>

    <rect x="510" y="20" width="500" height="170" rx="14" fill="none" stroke="#006a87" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="528" y="45" fill="#001f3d" font-size="13.5">Pronóstico ➲ ¿cuánto se vende el próximo mes?</text>
    <rect x="530" y="60" width="180" height="90" rx="8" fill="#ffffff" stroke="#006a87" stroke-width="1.5"/>
    <text x="620" y="96" text-anchor="middle" fill="#001f3d" font-size="15.5" font-weight="700">Pronóstico mensual</text>
    <text x="620" y="118" text-anchor="middle" fill="#006a87" font-size="11.5" font-style="italic">20 productos</text>
    <text x="620" y="134" text-anchor="middle" fill="#006a87" font-size="11.5" font-style="italic">referencias vs. ML</text>
    <line x1="710" y1="105" x2="748" y2="105" stroke="#001f3d" stroke-width="1.5" marker-end="url(#arrow-vsol)"/>
    <rect x="750" y="60" width="190" height="90" rx="8" fill="#ffffff" stroke="#006a87" stroke-width="1.5"/>
    <text x="845" y="96" text-anchor="middle" fill="#001f3d" font-size="15.5" font-weight="700">Backtest</text>
    <text x="845" y="118" text-anchor="middle" fill="#006a87" font-size="11.5" font-style="italic">24 meses</text>
    <text x="845" y="134" text-anchor="middle" fill="#006a87" font-size="11.5" font-style="italic">WAPE · MASE · bootstrap</text>

    <rect x="510" y="210" width="500" height="170" rx="14" fill="none" stroke="#006a87" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="528" y="235" fill="#001f3d" font-size="13.5">Anomalías ➲ ¿qué día no encaja?</text>
    <rect x="530" y="250" width="180" height="90" rx="8" fill="#ffffff" stroke="#006a87" stroke-width="1.5"/>
    <text x="620" y="286" text-anchor="middle" fill="#001f3d" font-size="15.5" font-weight="700">Anomalías diarias</text>
    <text x="620" y="308" text-anchor="middle" fill="#006a87" font-size="11.5" font-style="italic">6 detectores</text>
    <text x="620" y="324" text-anchor="middle" fill="#006a87" font-size="11.5" font-style="italic">incl. rachas sin venta</text>
    <line x1="710" y1="295" x2="748" y2="295" stroke="#001f3d" stroke-width="1.5" marker-end="url(#arrow-vsol)"/>
    <rect x="750" y="250" width="190" height="90" rx="8" fill="#ffffff" stroke="#006a87" stroke-width="1.5"/>
    <text x="845" y="286" text-anchor="middle" fill="#001f3d" font-size="15.5" font-weight="700">Contra anomalías</text>
    <text x="845" y="304" text-anchor="middle" fill="#001f3d" font-size="15.5" font-weight="700">conocidas</text>
    <text x="845" y="326" text-anchor="middle" fill="#006a87" font-size="11.5" font-style="italic">precisión y recall</text>

    <rect x="510" y="400" width="500" height="170" rx="14" fill="none" stroke="#006a87" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="528" y="425" fill="#001f3d" font-size="13.5">Segmentación ➲ ¿qué tipos de cliente hay?</text>
    <rect x="530" y="440" width="180" height="90" rx="8" fill="#ffffff" stroke="#006a87" stroke-width="1.5"/>
    <text x="620" y="476" text-anchor="middle" fill="#001f3d" font-size="15.5" font-weight="700">Segmentación</text>
    <text x="620" y="498" text-anchor="middle" fill="#006a87" font-size="11.5" font-style="italic">RFM con K-means</text>
    <text x="620" y="514" text-anchor="middle" fill="#006a87" font-size="11.5" font-style="italic">GMM y quintiles</text>
    <line x1="710" y1="485" x2="748" y2="485" stroke="#001f3d" stroke-width="1.5" marker-end="url(#arrow-vsol)"/>
    <rect x="750" y="440" width="190" height="90" rx="8" fill="#ffffff" stroke="#006a87" stroke-width="1.5"/>
    <text x="845" y="476" text-anchor="middle" fill="#001f3d" font-size="15.5" font-weight="700">Contra 2024</text>
    <text x="845" y="500" text-anchor="middle" fill="#006a87" font-size="11.5" font-style="italic">¿separa quién</text>
    <text x="845" y="516" text-anchor="middle" fill="#006a87" font-size="11.5" font-style="italic">vuelve a comprar?</text>

    <line x1="940" y1="105" x2="1050" y2="285" stroke="#001f3d" stroke-width="1.5" marker-end="url(#arrow-vsol)"/>
    <line x1="940" y1="295" x2="1055" y2="295" stroke="#001f3d" stroke-width="1.5" marker-end="url(#arrow-vsol)"/>
    <line x1="940" y1="485" x2="1050" y2="305" stroke="#001f3d" stroke-width="1.5" marker-end="url(#arrow-vsol)"/>
    <text x="1065" y="290" text-anchor="start" fill="#001f3d" font-size="14.5" font-weight="700">Explorador</text>
    <text x="1065" y="310" text-anchor="start" fill="#001f3d" font-size="14.5" font-weight="700">de decisiones</text>
</svg>
